# This continuous integration pipeline is triggered anytime a user pushes code to the repo.
# This pipeline builds the Wpf project, runs unit tests, then saves the MSIX build artifact.
name:  Windows CI

# Trigger on every master branch push and pull request
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  # Allows starting a build by hand from the Actions tab
  workflow_dispatch:

jobs:

  build:

    strategy:
      matrix:
        targetplatform: [x64]

    runs-on: windows-latest


    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.


    - uses: actions/setup-python@v5
      id: python
      with:
        python-version: '3.14'


    # Build the MSI in a fresh venv, the same way as a local Windows build
    - name: Build a Windows App
      shell: pwsh
      run: .\winbuild_env.ps1 -BasePython "${{ steps.python.outputs.python-path }}"

    # Upload the MSIX package: https://github.com/marketplace/actions/upload-artifact
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MSI Package
        path: dist
